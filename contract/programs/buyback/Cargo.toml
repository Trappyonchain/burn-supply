[package]
name = "burned-fun"
version = "0.1.0"
edition = "2021"
description = "Permissionless Pump.fun Token-2022 creator-fee buyback and atomic burn"

[lib]
name = "burned_fun"
crate-type = ["cdylib"]

[features]
default = ["entrypoint"]
entrypoint = []
test-fixture = []

[dependencies]
pinocchio = { version = "=0.11.2", default-features = false, features = ["cpi"] }
pinocchio-system = "=0.6.1"
pinocchio-token-2022 = { version = "=0.3.1", default-features = false }
solana-security-txt = "=1.1.3"

[target.'cfg(not(any(target_os = "solana", target_arch = "bpf")))'.dependencies]
solana-address = { version = "=2.6.1", features = ["curve25519", "decode", "sha2"] }

[dev-dependencies]
litesvm = "=0.16.0"
solana-address = { version = "=2.6.1", features = ["atomic", "curve25519", "decode", "sha2"] }
solana-clock = "=3.1.1"
solana-instruction = "=3.4.0"
solana-message = "=4.2.4"
solana-system-interface = { version = "=3.2.0", features = ["bincode"] }
solana-transaction = "=4.1.5"
